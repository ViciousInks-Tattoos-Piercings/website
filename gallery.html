 <button id="backToTop" class="fixed bottom-32 right-6 bg-red-600 p-3 rounded-full text-white hidden">↑</button>

<!-- Tabs Script -->
<script>

    window.addEventListener("scroll", () => {
            if (window.scrollY > 300) {
                backToTop.classList.remove("hidden");
            } else {
                backToTop.classList.add("hidden");
            }
        });

        backToTop.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
        
  const tabs = document.querySelectorAll('.tab-btn');
  const feeds = document.querySelectorAll('.feed');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.getAttribute('data-tab');

      feeds.forEach(feed => feed.classList.add('hidden'));
      document.getElementById(target).classList.remove('hidden');

      tabs.forEach(t => t.classList.replace('bg-red-600','bg-gray-700'));
      tab.classList.replace('bg-gray-700','bg-red-600');
    });
  });
</script>
